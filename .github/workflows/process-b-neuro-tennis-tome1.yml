name: PROCESS B — Affiche statique Neuro-Tennis Tome 1
on:
  push:
    branches:
      - test-process-b-neuro-tennis-tome1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-promo-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip fonts-dejavu-core
          python3 -m pip install --break-system-packages Pillow
      - name: Télécharger et vérifier la couverture officielle Amazon
        run: |
          curl -L --retry 3 --retry-delay 3 --fail --show-error \
            "https://images-na.ssl-images-amazon.com/images/P/B0GM6DB361.01._SCLZZZZZZZ_.jpg" \
            -o neuro-tennis-tome1-cover.jpg
          test -s neuro-tennis-tome1-cover.jpg
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("neuro-tennis-tome1-cover.jpg")
          im.verify()
          im=Image.open("neuro-tennis-tome1-cover.jpg")
          print("Couverture officielle récupérée :", im.format, im.size)
          if im.width < 300 or im.height < 400:
              raise SystemExit("Image trop petite pour être une couverture exploitable")
          PY
      - name: Créer l’affiche statique PROCESS B — référence V3
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math
          W,H=1080,1920
          im=Image.new("RGB",(W,H),(4,16,42))
          px=im.load()
          for y in range(H):
              for x in range(W):
                  glow=max(0,1-math.sqrt(((x-470)/850)**2+((y-760)/1250)**2))
                  px[x,y]=(int(4+5*glow),int(16+30*glow),int(42+66*glow))
          d=ImageDraw.Draw(im,"RGBA")
          reg="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          def F(path,size): return ImageFont.truetype(path,size)
          # Subtle neural network, inspired by the brain motif on the official cover
          nodes=[(720,250),(850,190),(965,285),(790,365),(950,430),(690,465),(875,535)]
          edges=[(0,1),(1,2),(0,3),(3,4),(3,5),(5,6),(4,6),(2,4)]
          for a,b in edges:
              d.line((*nodes[a],*nodes[b]),fill=(55,177,235,100),width=2)
          for x,y in nodes:
              d.ellipse((x-8,y-8,x+8,y+8),fill=(255,205,40,220))
              d.ellipse((x-19,y-19,x+19,y+19),outline=(65,180,240,90),width=2)
          # Header
          d.rounded_rectangle((58,48,370,95),radius=22,fill=(9,48,78,255),outline=(42,177,225,255),width=2)
          d.text((82,58),"NEUROSCIENCES  •  TENNIS",font=F(bold,20),fill=(122,220,255))
          d.text((52,132),"LE MATCH SE JOUE",font=F(bold,64),fill=(246,249,255))
          d.text((52,205),"AUSSI DANS LE CERVEAU",font=F(bold,62),fill=(255,202,35))
          d.rounded_rectangle((55,292,565,302),radius=5,fill=(255,202,35))
          d.text((58,330),"Les neurosciences au service de votre tennis",font=F(reg,29),fill=(209,226,245))
          # Main content panel
          d.rounded_rectangle((42,405,1038,1110),radius=34,fill=(7,31,65,238),outline=(36,166,220,220),width=2)
          d.rounded_rectangle((75,435,330,485),radius=23,fill=(255,202,35,255))
          d.text((98,447),"LE LIVRE  •  TOME 1",font=F(bold,20),fill=(4,22,48))
          # Official cover: 25% larger than V2 reference (224x335 -> approx. 280x419)
          cover=Image.open("neuro-tennis-tome1-cover.jpg").convert("RGB")
          cover_h=419
          cover_w=round(cover.width*cover_h/cover.height)
          cover=cover.resize((cover_w,cover_h),Image.Resampling.LANCZOS)
          cx,cy=75,530
          shadow=Image.new("RGBA",(cover_w+70,cover_h+70),(0,0,0,0))
          sd=ImageDraw.Draw(shadow)
          sd.rounded_rectangle((18,18,cover_w+48,cover_h+48),radius=8,fill=(0,0,0,190))
          shadow=shadow.filter(ImageFilter.GaussianBlur(18))
          im.paste(shadow,(cx-18,cy-12),shadow)
          im.paste(cover,(cx,cy))
          d=ImageDraw.Draw(im,"RGBA")
          d.rectangle((cx,cy,cx+cover_w-1,cy+cover_h-1),outline=(245,250,255,235),width=3)
          d.text((75,970),"ERIC SOTOCA",font=F(bold,23),fill=(250,252,255))
          d.text((75,1004),"Éditions Sotoca",font=F(reg,18),fill=(143,177,207))
          # Four benefit cards — clear of the cover
          benefits=[("01","ANTICIPER","plus tôt"),("02","MAÎTRISER","la pression"),("03","GARDER","son attention"),("04","DÉCIDER","avec lucidité")]
          bx=420
          for i,(num,head,sub) in enumerate(benefits):
              y=520+i*143
              d.rounded_rectangle((bx,y,990,y+116),radius=22,fill=(13,52,87,245),outline=(40,170,225,220),width=2)
              d.ellipse((bx+18,y+25,bx+84,y+91),outline=(255,202,35,255),width=4)
              d.text((bx+33,y+43),num,font=F(bold,20),fill=(255,211,50))
              d.text((bx+105,y+23),head,font=F(bold,28),fill=(250,252,255))
              d.text((bx+105,y+63),sub,font=F(reg,25),fill=(255,211,50))
              d.line((bx+105,y+100,bx+390,y+100),fill=(52,177,225,210),width=3)
          # Original supporting graphics inspired by the cover's tennis ball + brain:
          # stylised tennis-ball seam orbit, neural nodes and court/trajectory diagram.
          d.text((54,1150),"LE CERVEAU, UN ATOUT SUR LE COURT",font=F(bold,31),fill=(248,250,255))
          d.text((54,1195),"Comprendre ses mécanismes pour mieux jouer.",font=F(reg,24),fill=(175,202,226))
          d.rounded_rectangle((55,1245,1025,1500),radius=28,fill=(8,39,70,245),outline=(40,166,220,220),width=2)
          # Schematic court
          d.rounded_rectangle((100,1280,625,1460),radius=8,outline=(83,196,231,220),width=3)
          d.line((362,1280,362,1460),fill=(83,196,231,190),width=2)
          d.line((100,1370,625,1370),fill=(83,196,231,190),width=2)
          d.line((145,1435,280,1335,430,1395,560,1305),fill=(255,204,35,255),width=5)
          # Tennis ball motif, with curved seams, not a copy of the cover artwork
          bx,by,br=705,1370,72
          d.ellipse((bx-br,by-br,bx+br,by+br),fill=(205,224,48,255),outline=(250,255,180,255),width=3)
          d.arc((bx-br+10,by-br-5,bx+br-10,by+br+5),start=285,end=105,fill=(255,255,235,255),width=5)
          d.arc((bx-br+10,by-br-5,bx+br-10,by+br+5),start=105,end=285,fill=(255,255,235,255),width=5)
          # Neural / cognition labels
          labels=[("ÉMOTIONS","les réguler"),("ATTENTION","la maintenir"),("DÉCISION","la clarifier")]
          for i,(a,b) in enumerate(labels):
              y=1280+i*68
              yy=1300+i*68
              d.ellipse((825,yy,842,yy+17),fill=(255,202,35,255))
              d.text((858,y),a,font=F(bold,18),fill=(248,250,255))
              d.text((858,y+25),b,font=F(reg,16),fill=(165,196,222))
          # CTA
          d.rounded_rectangle((55,1550,1025,1740),radius=38,fill=(255,202,35,255))
          d.text((105,1580),"PASSEZ À UN AUTRE NIVEAU",font=F(bold,40),fill=(4,23,50))
          d.text((105,1640),"RETROUVEZ CE LIVRE SUR AMAZON",font=F(bold,34),fill=(4,23,50))
          d.text((55,1800),"ERIC SOTOCA  •  NEUROSCIENCES & PERFORMANCE",font=F(reg,21),fill=(204,221,240))
          d.text((55,1837),"NEURO-TENNIS  /  L’AMYGDALE AU FILET  /  TOME 1",font=F(reg,18),fill=(119,160,197))
          im.save("neuro-tennis-tome1-affiche.png")
          print("Affiche statique V3 créée : couverture officielle +25%, motifs originaux inspirés du cerveau et du tennis.")
          PY
      - name: Publier uniquement l’affiche statique et la couverture source
        uses: actions/upload-artifact@v4
        with:
          name: process-b-neuro-tennis-tome1-affiche-statique
          path: |
            neuro-tennis-tome1-affiche.png
            neuro-tennis-tome1-cover.jpg
          retention-days: 7
